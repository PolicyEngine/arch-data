# Stat-Xplore Open Data API extract: Households on Universal Credit by
# Family Type, Great Britain, May 2025 (raw API response artifact, query
# echoed inside it). policyengine-uk-data's base thousands (2868.011 etc.)
# are the provisional May 2025 vintage of this same cube; its
# undercount_relative inflation is uk-data-computed and excluded per the
# facts-only ADR - populace re-declares it over these raw counts.
# Cross-cube reconciliation note (adversarial review): the same May-2025
# universe queried through different dimensions returns totals that differ
# by a handful of households (family-type cube total 6,584,241 vs
# number-of-children cube total 6,584,239; summing the band x family cube's
# non-overlapping bands differs from the family-type marginals by 4-20 per
# family type). DWP applies cell-level adjustment at source, so cross-cube
# marginals are not expected to reconcile exactly; each package carries its
# own cube's publisher-emitted values.
