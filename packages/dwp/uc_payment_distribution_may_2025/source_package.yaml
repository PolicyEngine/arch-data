# Stat-Xplore Open Data API extract: Households on Universal Credit, May
# 2025, Monthly Award Amount (bands) x Family Type, Great Britain. The
# artifact is the raw API response (query echoed inside it; api_response
# precedent) on the new statxplore_table_json_rows lane. The publisher band
# list includes 'No payment' and an overlapping '£1500.01 or over' summary
# band alongside its £100 sub-bands - every band lands with its exact
# publisher label as the categorical identity, so no fact duplicates
# another, and the five '£1500.01 or over' rows carry table_record_kind
# 'total' (they are subtotals over the £100 sub-bands above £1,500 - summing
# the 'detail' rows alone yields disjoint coverage); mapping labels to numeric monthly bounds (and the x12
# annualization policyengine-uk-data applies) is populace-side. Vintage
# note: uk-data's committed pivot is the provisional May 2025 (p) extract;
# DWP has since revised the month, so values here are the current revised
# series. uk-data's parse also drops the open top band to NaN (its
# nan_to_nan targets) - here '£2500.01 or over' is an ordinary category.
# Cross-cube reconciliation note (adversarial review): the same May-2025
# universe queried through different dimensions returns totals that differ
# by a handful of households (family-type cube total 6,584,241 vs
# number-of-children cube total 6,584,239; summing the band x family cube's
# non-overlapping bands differs from the family-type marginals by 4-20 per
# family type). DWP applies cell-level adjustment at source, so cross-cube
# marginals are not expected to reconcile exactly; each package carries its
# own cube's publisher-emitted values.
