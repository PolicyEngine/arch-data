    concept_relation: exact
    concept_authority: sfpd
    concept_evidence_url: https://www.sfpd.fgov.be/files/3432/fr_stat_2502.pdf
    concept_evidence_notes: >-
      SFPD table 2.4.1 reports 118,262 GRAPA beneficiaries for January 2025,
      split into 42,346 men and 75,916 women. It is a monthly regular-payment
      snapshot, not an annual-average, year-end, annual-any, eligibility, or
      payment-transaction count. The publication uses both beneficiaries and
      cases but does not publish its person-key deduplication method.
    unit: count
