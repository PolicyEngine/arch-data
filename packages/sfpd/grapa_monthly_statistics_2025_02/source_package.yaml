    concept_relation: exact
    concept_authority: sfpd
    concept_evidence_url: https://www.sfpd.fgov.be/files/3432/fr_stat_2502.pdf
    concept_evidence_notes: >-
      SFPD table 2.4.1 pairs the January 2025 beneficiary population with
      EUR 85,039,735.46 in monthly GRAPA payments. The men and women payment
      rows sum exactly to the published total.
    unit: eur
    aggregation: sum
    expected_cell_type: number
