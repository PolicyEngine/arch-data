# SFPD's February 2025 monthly-statistics PDF is the value artifact. The
# package selects publisher numbers from tables 2.2 and 2.4.1 through the
# pdf_text_numbers parser; no manually transcribed or computed value artifact
# sits between the PDF and these Chronicle facts. The package retains its
# historical alias while narrowing the pension total to the employee and
# self-employed regimes explicitly covered by table 2.2.
schema_version: ledger.source_package.v1
package_id: sfpd-legal-pension-caseload-2025
label: SFPD February 2025 pension and GRAPA beneficiaries and monthly expenditure
artifact:
  source_name: sfpd_monthly_social_benefits
  source_table: >-
    Statistique mensuelle des prestations sociales - Février 2025,
    tables 2.2 and 2.4.1
  resource_package: db
  resource_directory: data/sfpd/legal_pension_caseload_2025
  manifest: manifest.yaml
  vintage: monthly_social_benefits_2025_02
  extracted_at: '2026-08-30'
  extraction_method: pypdf text-line number extraction from the full publisher PDF
  parser: pdf_text_numbers
  number_format: european
  artifact_year: 2025

record_sets:
- record_set_id: sfpd.month2025_02.pension.employee_self_employed.beneficiaries
  provenance_class: administrative
  assertion: observation
  record_set_spec_id: sfpd.pension.employee_self_employed.beneficiaries.v1
  source_record_id_prefix: sfpd.month2025_02.pension.employee_self_employed.beneficiaries
  sheet_name: document_numbers
  period_type: month
  period: '2025-02'
  period_coverage:
    basis: calendar
    start_date: '2025-02-01'
    end_date: '2025-02-01'
    source_period_label: au 01.02.2025
    notes: >-
      Table 2.2 is a stock at 1 February 2025, not an annual average or an
      annual-any recipient count.
  geography_id: BE
  geography_level: country
  geography_name: Belgium
  geography_vintage: current
  entity: person
  entity_role: legal_pension_beneficiary
  domain: legal_pensions
  groupby_dimension: sfpd.published_total
  rows:
  - value_id: employee_or_self_employed_total
    label: Employee and/or self-employed legal pension beneficiaries
    ordinal: 0
    row_number: 881
    expected_row_header_column: C
    expected_row_header: 2.435.457 1.810.192 93.346Nombre
    table_record_kind: total
    guard_cells:
    - column: A
      expected_value: 22
      label: PDF page number
    - column: B
      expected_value: 56
      label: PDF extracted line number
    - column: D
      expected_value: 2.435.457
      label: Publisher number text
    - column: C
      row: 844
      expected_value: 2.2 Répartition du nombre de bénéficiaires et dépense mensuelle (en €)
      label: Table title line
  measures:
  - measure_id: beneficiaries
    label: Employee and/or self-employed legal pension beneficiaries
    ordinal: 0
    column: E
    source_column_id: numeric_value
    expected_column_header_row: 1
    expected_column_header: numeric_value
    concept: sfpd.employee_or_self_employed_legal_pension_beneficiary_count
    source_concept: sfpd.monthly_statistics.table_2_2.total_beneficiaries
    concept_relation: source_label
    concept_authority: sfpd
    concept_evidence_url: https://www.sfpd.fgov.be/files/3432/fr_stat_2502.pdf
    concept_evidence_notes: >-
      SFPD table 2.2, printed page 22, Total - Men and women, Without
      distinction row, Nombre column: 2.435.457. The report states that the
      table covers people with an employee and/or self-employed retirement or
      survivor pension. It does not include a civil-servant regime column.
    unit: count
    aggregation: sum
    expected_cell_type: number

